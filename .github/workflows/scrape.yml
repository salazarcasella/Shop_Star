name: Diagnosticar Bombas Millas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - ".github/workflows/scrape.yml"

permissions:
  contents: read

concurrency:
  group: shopstar-bombas-millas
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Dependencias Python
        run: pip install -r requirements.txt

      - name: Chromium para Playwright
        run: playwright install --with-deps chromium

      - name: Diagnóstico Shopstar
        run: python -m scraper.diagnose_catalog
