name: Actualizar Bombas Millas

on:
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * *" # 08:15 America/Lima
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write

concurrency:
  group: shopstar-bombas-millas
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Dependencias Python
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Chromium para Playwright
        run: playwright install --with-deps chromium

      - name: Extraer catálogo completo
        env:
          MIN_EXPECTED_PRODUCTS: "100"
          MIN_CATALOG_COVERAGE: "0.95"
          MIN_RATIO_COVERAGE: "0.00"
          DETAIL_CONCURRENCY: "6"
          DETAIL_LIMIT: "300"
        run: python -m scraper.shopstar_bombas_millas_v2

      - name: Diagnosticar calidad de extracción
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/latest.json").read_text(encoding="utf-8"))
          m = data["metadata"]
          products = data["products"]
          missing_price = [p for p in products if not p.get("price_soles")]
          missing_miles = [p for p in products if not p.get("miles_benefit")]
          missing_ratio = [p for p in products if p.get("soles_per_mile") is None]
          print(f"Productos: {m['product_count']} / declarado: {m.get('declared_product_total')}")
          print(f"Con precio: {m.get('products_with_price')}")
          print(f"Con millas: {m.get('products_with_miles')}")
          print(f"Con ratio: {m.get('products_with_ratio')} ({m.get('ratio_coverage', 0):.1%})")
          print(f"Network capturados: {m.get('network_products_captured')} / merged: {m.get('network_products_merged')}")
          print(f"Detail solicitados: {m.get('detail_pages_requested')} / enriquecidos: {m.get('detail_pages_enriched')} / errores: {m.get('detail_errors')}")
          print(f"Faltan precio: {len(missing_price)} | faltan millas: {len(missing_miles)} | faltan ratio: {len(missing_ratio)}")
          print("\nMUESTRA SIN PRECIO:")
          for p in missing_price[:20]:
              print(json.dumps({k: p.get(k) for k in ('name','url','sku_id','miles_benefit','price_soles','price_source','detail_error','detail_text_excerpt')}, ensure_ascii=False))
          print("\nMUESTRA SIN MILLAS:")
          for p in missing_miles[:20]:
              print(json.dumps({k: p.get(k) for k in ('name','url','sku_id','miles_benefit','price_soles','miles_source','detail_error','detail_text_excerpt')}, ensure_ascii=False))
          PY

      - name: Validar calidad antes de publicar
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          data = json.loads(Path("data/latest.json").read_text(encoding="utf-8"))
          m = data["metadata"]
          count = int(m.get("product_count") or 0)
          declared = int(m.get("declared_product_total") or 0)
          required = max(100, math.ceil(declared * 0.95)) if declared else 100
          ratio = float(m.get("ratio_coverage") or 0)
          if count < required:
              raise SystemExit(f"Catálogo incompleto: {count} productos; mínimo requerido {required}.")
          if ratio < 0.70:
              raise SystemExit(f"Datos incompletos: cobertura precio+millas {ratio:.1%}; mínimo requerido 70%.")
          print("Quality gate OK")
          PY

      - name: Guardar datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json
          git diff --cached --quiet || git commit -m "data: actualizar catálogo Bombas Millas [skip ci]"
          git push
